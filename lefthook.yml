lefthook: go tool lefthook # hook scripts call the version pinned in go.mod; no PATH install needed

assert_lefthook_installed: true

pre-commit:
  jobs:
    - name: format
      # Routes each staged file to its Go formatter; skips types it doesn't format.
      run: scripts/format.sh {staged_files}
      stage_fixed: true
    - name: lint-go
      run: make lint-go
    - name: test
      run: make test
